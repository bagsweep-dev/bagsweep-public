# Apex bagsweep.xyz serves the static marketing landing.
# The tracker app lives on app.bagsweep.xyz (see nginx-app.bagsweep.xyz.conf).
server {
    listen 80;
    server_name bagsweep.xyz www.bagsweep.xyz;

    root /opt/bagsweep/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
